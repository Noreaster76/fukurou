services:
  frigate:
    container_name: frigate-nest-box
    # Pinned to the version this config was validated against. Bump deliberately
    # (or use ":stable") and re-check the logs after upgrading.
    image: ghcr.io/blakeblackshear/frigate:0.18.3
    restart: unless-stopped
    # Frigate 0.18 wants >=130MB for one 1080p camera; 256MB leaves headroom.
    shm_size: "256mb"
    environment:
      # Supplied from .env (gitignored). Compose errors out if it is unset.
      FRIGATE_OWL_BOX_HOST: ${FRIGATE_OWL_BOX_HOST:?set FRIGATE_OWL_BOX_HOST in .env}
      FRIGATE_OWL_BOX_PASSWORD: ${FRIGATE_OWL_BOX_PASSWORD:?set FRIGATE_OWL_BOX_PASSWORD in .env}
    volumes:
      # Whole directory, writable: Frigate keeps its database, model cache and
      # config migrations here, so they survive container restarts.
      - ./config:/config
      # Recordings/snapshots. On the Pi this is the dedicated recordings
      # partition (set FRIGATE_MEDIA_DIR in .env); defaults to ./storage.
      - ${FRIGATE_MEDIA_DIR:-./storage}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      # Unauthenticated UI: reachable only from this machine (or an SSH tunnel).
      - "127.0.0.1:5000:5000"
      # Authenticated UI: the one to use from other devices on the LAN.
      - "8971:8971"
      # go2rtc's RTSP restream (:8554) is internal to the container; not published.
