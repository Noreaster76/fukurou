mqtt:
  enabled: false

# go2rtc pulls each camera stream once and re-serves it locally on :8554, so
# Frigate's record and detect roles don't each open a separate connection to
# the camera.
#
# The camera's IP and password are injected from the FRIGATE_OWL_BOX_HOST and
# FRIGATE_OWL_BOX_PASSWORD environment variables (see .env / .env.example) so
# neither is committed. The password must be URL-encoded because it lives
# inside a URL (e.g. $ -> %24, ! -> %21).
#
# Streams come over the camera's native Xiongmai DVRIP protocol (:34567), not
# RTSP. This firmware's RTSP server crashes the camera's main process under
# load (every 4-10 min with both streams; ~25 min with just the sub stream),
# whereas DVRIP ran for hours between crashes in testing. subtype=0 is the
# 1080p main stream, subtype=1 the 800x448 sub stream.
#
# RTSP fallback, if ever needed (keep #backchannel=0, which stops go2rtc's
# two-way-audio negotiation that this firmware mishandles):
#   rtsp://admin:{FRIGATE_OWL_BOX_PASSWORD}@{FRIGATE_OWL_BOX_HOST}:554/user=admin&password=&channel=1&stream=0.sdp?real_stream#backchannel=0
go2rtc:
  streams:
    owl_box_main:
      - dvrip://admin:{FRIGATE_OWL_BOX_PASSWORD}@{FRIGATE_OWL_BOX_HOST}:34567?channel=0&subtype=0
    owl_box_sub:
      - dvrip://admin:{FRIGATE_OWL_BOX_PASSWORD}@{FRIGATE_OWL_BOX_HOST}:34567?channel=0&subtype=1

# Recording policy: record only when there is motion or a detected object,
# kept "forever" by days -- the real limit is disk size. Recordings live on a
# dedicated 100 GB partition (FRIGATE_MEDIA_DIR); when it runs low, Frigate's
# storage maintainer deletes the oldest recordings first.
cameras:
  owl_box:
    ffmpeg:
      inputs:
        # Record the full 1080p H.264 stream by copy (no re-encode).
        - path: rtsp://127.0.0.1:8554/owl_box_main
          input_args: preset-rtsp-restream
          roles:
            - record
        # Motion and object detection run on the low-res sub stream.
        - path: rtsp://127.0.0.1:8554/owl_box_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 800
      height: 448
      fps: 5
    # The stock model has no owl or generic "animal" class, and sees owls from
    # above poorly; motion inside the static box is the main signal. Objects
    # are tracked anyway to label clips and to collect data for later tuning.
    objects:
      track:
        - bird
        - cat
        - dog
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 365
      alerts:
        pre_capture: 5
        post_capture: 10
        retain:
          days: 365
      detections:
        pre_capture: 5
        post_capture: 10
        retain:
          days: 365
    snapshots:
      enabled: true

version: 0.18-0
